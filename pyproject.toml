[project]
name = "vouch"
version = "0.1.0"
description = "Vouch — Real-time AI call screener for older adults powered by Gemini Live API and Gemini 4 Carbon"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "certifi>=2024.8.30",
    "fastapi>=0.115.0",
    "google-genai>=2.30.1",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "segno>=1.6.1",
    "uvicorn[standard]>=0.32.0",
    "websockets>=13.0",
]

[dependency-groups]
dev = [
    "playwright>=1.49.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
